# O plano free hiberna quando ocioso; não garante disponibilidade de um piloto.
services:
  - type: web
    name: azzo-room-game
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile.game-server
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_GUESTS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
